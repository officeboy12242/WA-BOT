services:
  - type: web
    name: whatsapp-course-bot
    env: node
    region: singapore
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y fonts-dejavu-core fonts-liberation fontconfig || true
      fc-cache -f || true
      npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHECK_INTERVAL
        value: 180
      - key: OWNER_NUMBERS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: telegramUdemy
      - key: STICKER_TARGET_GROUPS
        sync: false
      - key: STICKER_SOURCE_CHANNELS
        sync: false
      - key: STICKER_PACK_NAME
        value: Created By Sassy Bot 🤖
      - key: STICKER_PACK_AUTHOR
        value: ""
